<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البدر للتكنولوجيا - Elbadr Technology</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="home/elbadr LOGO.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #070f1e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .welcome-container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #ffffff;
            font-weight: 700;
        }
        p {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .shop-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 36px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }
        .shop-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.6);
        }
        .shop-btn i {
            transition: transform 0.3s ease;
        }
        .shop-btn:hover i {
            transform: translateX(-5px);
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <!-- تم تعديل مسار اللوجو ليدخل جوه مجلد home -->
        <img src="home/elbadr LOGO.jpg" alt="Elbadr Logo" class="logo">
        <h1>أهلاً بك في البدر تكنولوجي</h1>
        <p>وجهتك الأولى لأحدث الأجهزة المنزلية، الإلكترونيات الذكية، وكيل معتمد.</p>
        <!-- تم تعديل اللينك ليدخل جوه مجلد home ويفتح home.html -->
        <a href="home/home.html" class="shop-btn">
            <span>تسوق الآن</span>
            <i class="fas fa-arrow-left"></i>
        </a>
    </div>

</body>
</html>
